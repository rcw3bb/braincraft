[project]
name = "braincraft"
version = "1.3.1"
description = "A workshop of small, sharp utilities - carefully shaped helpers you reuse across projects to keep everyday coding tasks fast, tidy, and consistent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ron Webb"}
]
keywords = ["utilities", "ignorefile", "gitignore", "retry", "version-check"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "logenrich (>=1.0.1,<2.0.0)",
]

[project.urls]
Homepage = "https://github.com/rcw3bb/braincraft"
Repository = "https://github.com/rcw3bb/braincraft"
Changelog = "https://github.com/rcw3bb/braincraft/blob/main/CHANGELOG.md"
Issues = "https://github.com/rcw3bb/braincraft/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "braincraft"}]
include = ["CHANGELOG.md"]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
